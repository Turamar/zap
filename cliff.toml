# git-cliff config — auto-generates the "changes since last tag" notes during Zap Release.
#
# Design principles:
# - Primary grouping by conventional commit type (feat/fix/refactor/docs/test/build/ci/ui/perf/chore).
# - Scope kept as a bold `**(scope)**` prefix for quick per-subsystem scanning (ai/ssh/i18n/linux/...).
# - Merge commits, pure chore(release), Revert and similar noise are skipped outright.
# - Non-conventional commits fall into an "Other" catch-all group: no info lost, main groups stay clean.
# - Output is a bare fragment (no H1 title or date block); the workflow assembles it
#   below the release_body intro.

[changelog]
# No `# Changelog` title at the top; the publish_release step owns overall layout.
header = ""

body = """
{%- if previous %}
{%- if previous.version %}
**Range**: [`{{ previous.version }}` … `{{ version }}`]({{ self::compare_url(prev=previous.version, curr=version) }})

{% endif -%}
{%- endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.id %} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ self::commit_url(sha=commit.id) }})){% endif %}
{% endfor %}
{% endfor %}
{%- macro compare_url(prev, curr) -%}
https://github.com/Turamar/zap/compare/{{ prev }}...{{ curr }}
{%- endmacro -%}
{%- macro commit_url(sha) -%}
https://github.com/Turamar/zap/commit/{{ sha }}
{%- endmacro -%}
"""

# The between-tags compare footer is emitted by the template's compare_url above,
# so no extra footer is appended here.
footer = ""

trim = true

[git]
# Don't error when a commit isn't conventional; it falls into the catch-all group below.
conventional_commits = true
filter_unconventional = false
# Don't split multi-line bodies — one commit, one entry.
split_commits = false

# Tag naming: v prefix + anything (v2026.05.27.2 / v2026.05.06.preview / v2026.05.21.zaptest01).
tag_pattern = "v[0-9].*"

# Keep git-log order (new → old) for readability.
topo_order = false
sort_commits = "newest"

# Ignore merges / internal release tags and other user-meaningless commits.
commit_preprocessors = [
    # Strip trailing PR numbers, so `(#171)` doesn't duplicate the hash link below.
    # `(?m)` anchors `$` to each line end (the subject is the first line), not the whole message end.
    { pattern = '(?m) \(#[0-9]+\)$', replace = "" },
    # Strip leading gitmoji prefixes (e.g. "♻️ refactor: ..."),
    # otherwise `^refactor`-style grouping rules can't match and the commit falls into "Other".
    { pattern = '^(♻️|✨|🐛|🎨|🚀|🔥|💄|📝|🛠|⚡|🚧|🐳|🔧|🚨|✅|♿|🔒)[️]?\s*', replace = "" },
]

# Order-sensitive: first match wins. Noise skips go first.
commit_parsers = [
    # Noise: skip
    { message = "^[Mm]erge ", skip = true },
    { message = "^[Rr]evert ", skip = true },
    { message = "^[Bb]ump ", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^v[0-9]+\\.", skip = true },

    # Conventional commit main groups (English titles, render order = listed order)
    { message = "^feat", group = "✨ Features" },
    { message = "^fix", group = "🐛 Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "♻️ Refactors" },
    { message = "^ui", group = "🎨 UI" },
    { message = "^style", group = "🎨 UI" },
    { message = "^test", group = "🧪 Tests" },
    { message = "^docs", group = "📝 Docs" },
    { message = "^(build|ci|chore)", group = "🛠 Build & chores" },

    # Catch-all: keep any other commit shape under "Other", so non-conventional commits aren't lost.
    { message = ".*", group = "📦 Other" },
]
